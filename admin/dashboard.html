<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم مي أرابيا</title>
<link rel="icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="dashboard.css?v=8">
</head>
<body>

  <div class="screen" id="screenDashboard" style="display:block; min-height:auto; padding:0;">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="../assets/mijdaf-mark-orange.png" alt="مي أرابيا">
        <span>لوحة تحكم مي أرابيا</span>
      </div>
      <div class="topbar-actions">
        <button id="notifyBtn" class="btn-ghost" type="button">🔔 تفعيل الإشعارات</button>
        <button id="logoutBtn" class="btn-ghost" type="button">تسجيل خروج</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="messages" role="tab" aria-selected="true">
        الرسائل <span class="badge" id="unreadBadge" hidden>0</span>
      </button>
      <button class="tab" data-tab="images" role="tab" aria-selected="false">الصور</button>
    </nav>

    <main class="content">

      <!-- تاب الرسائل -->
      <section id="tabMessages" class="tab-panel is-active">
        <div class="panel-head">
          <h2>الرسائل الواردة</h2>
          <button id="refreshMessagesBtn" class="btn-ghost small" type="button">تحديث</button>
        </div>
        <div id="messagesList" class="messages-list"></div>
        <p id="messagesEmpty" class="muted center" hidden>لا توجد رسائل حتى الآن.</p>
      </section>

      <!-- تاب الصور -->
      <section id="tabImages" class="tab-panel">
        <div class="panel-head">
          <h2>صور المعرض</h2>
          <button id="addImageBtn" class="btn-primary small" type="button">+ إضافة صورة</button>
        </div>
        <div id="imagesGrid" class="images-grid"></div>
        <p id="imagesEmpty" class="muted center" hidden>لا توجد صور مضافة حتى الآن — يعرض الموقع الصور الافتراضية.</p>
      </section>

    </main>
  </div>

  <!-- مودال: إضافة/تعديل صورة -->
  <div class="overlay" id="imageModalOverlay">
    <div class="modal">
      <button class="modal-close" id="imageModalClose" type="button">×</button>
      <h3>إضافة صورة للمعرض</h3>
      <form id="imageForm" class="stack">
        <label>اختر صورة من جهازك
          <input type="file" id="imgFile" accept="image/*">
        </label>
        <p class="muted small">أو أدخل رابط صورة جاهز بدلاً من ذلك:</p>
        <label>رابط الصورة (اختياري، بدلاً من الرفع)
          <input type="url" id="imgUrl" placeholder="https://...">
        </label>
        <label>العنوان (عربي)
          <input type="text" id="imgTitleAr" required>
        </label>
        <label>العنوان (إنجليزي)
          <input type="text" id="imgTitleEn">
        </label>
        <label>الوصف (عربي)
          <textarea id="imgTextAr" rows="2"></textarea>
        </label>
        <label>الوصف (إنجليزي)
          <textarea id="imgTextEn" rows="2"></textarea>
        </label>
        <label>حجم الصورة في الشبكة
          <select id="imgSize">
            <option value="normal">عادي</option>
            <option value="wide">عريض</option>
            <option value="big">كبير</option>
          </select>
        </label>
        <p class="error" id="imageFormError" hidden></p>
        <button type="submit" class="btn-primary">حفظ الصورة</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=6"></script>
  <script src="../assets/js/data-service.js?v=6"></script>
  <script src="dashboard.js?v=8"></script>
</body>
</html>
