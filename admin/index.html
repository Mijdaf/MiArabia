<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>دخول الأدمن — مي أرابيا</title>
<link rel="icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="dashboard.css?v=4">
</head>
<body>

  <div class="screen" id="screenLogin">
    <div class="panel panel-narrow">
      <img class="brand-mark" src="../assets/mijdaf-mark-orange.png" alt="مي أرابيا">
      <h1>دخول الأدمن</h1>
      <form id="loginForm" class="stack">
        <label>البريد الإلكتروني
          <input type="email" id="loginEmail" required autocomplete="username">
        </label>
        <label>كلمة المرور
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>
        <p class="error" id="loginError" hidden></p>
        <button type="submit" class="btn-primary">دخول</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=4"></script>
  <script src="../assets/js/data-service.js?v=4"></script>
  <script src="login.js?v=4"></script>
</body>
</html>
