<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Mijdaf</title>
<link rel="icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="dashboard.css?v=8">
</head>
<body>

  <div class="screen" id="screenLogin">
    <div class="panel panel-narrow">
      <img class="brand-mark" src="../assets/mijdaf-mark-orange.png" alt="Mijdaf">
      <h1>Admin Login</h1>
      <form id="loginForm" class="stack">
        <label>Email
          <input type="email" id="loginEmail" required autocomplete="username">
        </label>
        <label>Password
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>

        <!--
          CAPTCHA (Google reCAPTCHA) — completely free:
          1) Go to https://www.google.com/recaptcha/admin/create
          2) Choose "reCAPTCHA v2" -> "I'm not a robot" Checkbox
          3) Add your site's domain (e.g. mijdaf.com) under Domains
          4) You'll get a "Site key" and "Secret key" — you only need the "Site key" here
          5) Replace PASTE_SITE_KEY_HERE below with the key you received
          If you leave PASTE_SITE_KEY_HERE as is, the captcha stays hidden and login works normally without it.
        -->
        <div class="captcha-wrap">
          <div class="g-recaptcha" data-sitekey="6LcztL4tAAAAAJA6iukHqCFrs9bpw8Z2ubeepjUJ"></div>
        </div>

        <p class="error" id="loginError" hidden></p>
        <button type="submit" class="btn-primary">Log in</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="../assets/js/supabase-config.js?v=7"></script>
  <script src="../assets/js/data-service.js?v=7"></script>
  <script src="login.js?v=7"></script>
</body>
</html>
